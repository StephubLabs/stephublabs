<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Morara Stephen - Frontend Engineer and Growth Hacker</title>
  <desc id="desc">Dark technology banner introducing Morara Stephen, a Nairobi-based frontend engineer, growth hacker, and data-driven builder, with a terminal-style profile card.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080F"/>
      <stop offset="0.55" stop-color="#080D18"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="13%" cy="18%" r="60%">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="88%" cy="10%" r="58%">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="58%" cy="110%" r="45%">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="0.7"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#020617" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>
  <rect width="1280" height="380" fill="url(#glowCyan)"/>
  <rect width="1280" height="380" fill="url(#glowIndigo)"/>
  <rect width="1280" height="380" fill="url(#glowEmerald)"/>
  <rect width="1280" height="380" fill="url(#grid)" opacity="0.28"/>
  <rect width="1280" height="4" fill="url(#topbar)"/>

  <rect x="40" y="56" width="4" height="208" rx="2" fill="url(#accent)"/>

  <rect x="64" y="56" width="336" height="34" rx="17" fill="#081722" stroke="#164E63" stroke-width="1"/>
  <circle cx="84" cy="73" r="4" fill="#34D399"/>
  <text x="98" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.2" fill="#67E8F9">FRONTEND · GROWTH · DATA</text>

  <text x="64" y="169" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.2" fill="#F8FAFC">MORARA STEPHEN</text>
  <text x="66" y="211" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="500" fill="#CBD5E1">Frontend Engineer · Growth Hacker · Data-Driven Builder</text>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#94A3B8">
    <path d="M68 241.5c0 4.4-6 10.5-6 10.5s-6-6.1-6-10.5a6 6 0 1 1 12 0Z" fill="none" stroke="#64748B" stroke-width="1.6"/>
    <circle cx="62" cy="241.5" r="2.1" fill="#64748B"/>
    <text x="82" y="248">Nairobi, Kenya · EAT (UTC+3) · Remote-ready</text>
  </g>

  <text x="66" y="312" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="0.4" fill="#64748B">TypeScript / React / Python / SQL / SEO / CRO / Analytics</text>

  <g filter="url(#shadow)">
    <rect x="812" y="78" width="404" height="224" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1.2"/>
    <path d="M812 94a16 16 0 0 1 16-16h372a16 16 0 0 1 16 16v22H812Z" fill="#0F172A"/>
    <line x1="812" y1="116" x2="1216" y2="116" stroke="#1E293B" stroke-width="1"/>
    <circle cx="836" cy="98" r="5" fill="#F87171" opacity="0.85"/>
    <circle cx="856" cy="98" r="5" fill="#FBBF24" opacity="0.85"/>
    <circle cx="876" cy="98" r="5" fill="#34D399" opacity="0.85"/>
    <text x="1014" y="102" text-anchor="middle" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#64748B">stephen.profile.ts</text>
  </g>

  <g font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve">
    <text x="836" y="154"><tspan fill="#C084FC">const</tspan><tspan fill="#67E8F9"> stephen</tspan><tspan fill="#94A3B8"> = {</tspan></text>
    <text x="836" y="180"><tspan fill="#7DD3FC">  role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">"Frontend Engineer"</tspan><tspan fill="#94A3B8">,</tspan></text>
    <text x="836" y="206"><tspan fill="#7DD3FC">  growth</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">"CRO · SEO · Analytics"</tspan><tspan fill="#94A3B8">,</tspan></text>
    <text x="836" y="232"><tspan fill="#7DD3FC">  data</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#86EFAC">"SQL"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#86EFAC">"Python"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#86EFAC">"Excel"</tspan><tspan fill="#94A3B8">],</tspan></text>
    <text x="836" y="258"><tspan fill="#7DD3FC">  status</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#FBBF24">"open_to_work"</tspan><tspan fill="#94A3B8">,</tspan></text>
    <text x="836" y="284"><tspan fill="#94A3B8">};</tspan></text>
  </g>
  <text x="836" y="306" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#22D3EE">›</text>
  <rect x="854" y="293" width="8" height="14" rx="1" fill="#22D3EE" opacity="0.75"/>

  <text x="1216" y="348" text-anchor="end" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#475569">github.com/stephublabs</text>
</svg>